# .github/workflows/firebase-hosting-pull-request.yml
name: Deploy to Firebase Hosting on PR
'on': pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. BUILD STEP (With Secrets) ---
      - name: Build
        run: npm ci && npm run build
        working-directory: exli-front
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUD_RUN_URL: ${{ secrets.VITE_CLOUD_RUN_URL_DEV }}

      # --- 2. DEPLOY STEP (Crucial!) ---
      - uses: FirebaseExtended/action-hosting-deploy@v0.9.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          # NOTE: Check your secrets in GitHub Settings to match this name exactly
          # It was auto-generated by firebase init, usually looks like this:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXLI_24 }}'
          projectId: exli-24
          entryPoint: exli-front