name: Deploy Backend DEV to Cloud Run

on:
  # Allows you to click "Run workflow" manually in GitHub Actions tab
  workflow_dispatch:

  # Trigger on push to any branch EXCEPT main
  push:
    branches-ignore:
      - main
    paths:
      - 'exli-backend/**' 

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-central2
  SERVICE_NAME: exli-processor-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Build and Deploy to Cloud Run (DEV)
        run: |
          cd exli-backend
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},DOCAI_PROCESSOR_ID=${{ secrets.DOCAI_PROCESSOR_ID }},GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCP_LOCATION=eu,TWELVEDATA_API_KEY=${{ secrets.TWELVEDATA_API_KEY }},SYSTEM_API_KEY=${{ secrets.SYSTEM_API_KEY }},SMTP_USER=${{ secrets.SMTP_USER }},SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }},NOTIFICATION_EMAIL=admin@example.com" \
            --cpu 1 \
            --memory 512Mi \
            --timeout 3600

      # Market data ingestion is production-only (2026-09-26): the dev Cloud Run
      # service refuses /system/ingest-market-data outright (see main.py), so
      # there's nothing to trigger or sync here for dev anymore - no scheduler
      # job to keep a header current for, no manual-test step that would do
      # anything but get "skipped" back. If dev-environment ingestion testing
      # is ever needed again, use production with a small ?limit= instead.