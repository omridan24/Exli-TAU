name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'exli-backend/**'  # Only run if backend code changes

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-central2
  SERVICE_NAME: exli-processor

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Build and Deploy to Cloud Run (PROD)
        run: |
          cd exli-backend
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},DOCAI_PROCESSOR_ID=${{ secrets.DOCAI_PROCESSOR_ID }},GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCP_LOCATION=eu,TRACELOOP_API_KEY=${{ secrets.TRACELOOP_API_KEY }},TWELVEDATA_API_KEY=${{ secrets.TWELVEDATA_API_KEY }},SYSTEM_API_KEY=${{ secrets.SYSTEM_API_KEY }},SMTP_USER=${{ secrets.SMTP_USER }},SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }},NOTIFICATION_EMAIL=admin@example.com" \
            --cpu 1 \
            --memory 512Mi \
            --timeout 3600

      - name: Get Service URL
        id: get_url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format 'value(status.url)')
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      # Market data ingestion is triggered by a Cloud Scheduler job hitting
      # /system/ingest-market-data once a day, not by deploys. See ops notes
      # for the `gcloud scheduler jobs create` command that provisions it.

      # Keeps that scheduler job's auth header in sync with the SYSTEM_API_KEY
      # secret, so GitHub Actions secrets stay the only place this key is ever
      # edited/rotated - this just re-pushes the current value on every deploy.
      # Requires the deploy service account to have roles/cloudscheduler.admin.
      - name: Sync ingestion scheduler auth header
        continue-on-error: true
        run: |
          gcloud scheduler jobs update http exli-market-ingest-daily-prod \
            --project ${{ env.PROJECT_ID }} \
            --location ${{ env.REGION }} \
            --update-headers "X-System-Key=${{ secrets.SYSTEM_API_KEY }},Content-Type=application/json"

      # FX (exchange rate) ingestion (docs/fx/01-fx-plan.md §2.3) has its own
      # daily job, hitting /system/ingest-fx before the stock job runs so
      # currencies never share its time budget again. See docs/fx/01-fx-plan.md
      # §2.3 for the `gcloud scheduler jobs create` command that provisions it
      # (one-time setup, not run by this workflow).
      - name: Sync FX ingestion scheduler auth header
        continue-on-error: true
        run: |
          gcloud scheduler jobs update http exli-fx-ingest-daily \
            --project ${{ env.PROJECT_ID }} \
            --location ${{ env.REGION }} \
            --update-headers "X-System-Key=${{ secrets.SYSTEM_API_KEY }},Content-Type=application/json"