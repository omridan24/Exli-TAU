<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background Container (Optional, adds weight) -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#ecfdf5" />
  
  <!-- Bar 1 (Left - Starting) -->
  <rect x="25" y="55" width="12" height="25" rx="6" fill="#34d399" />
  <circle cx="31" cy="55" r="6" fill="#34d399" />
  
  <!-- Bar 2 (Middle - Growing) -->
  <rect x="44" y="40" width="12" height="40" rx="6" fill="#10b981" />
  <circle cx="50" cy="40" r="6" fill="#10b981" />
  
  <!-- Bar 3 (Right - Success) -->
  <rect x="63" y="25" width="12" height="55" rx="6" fill="#059669" />
  <circle cx="69" cy="25" r="6" fill="#059669" />
  
  <!-- Connection Line (The "Network/Node" aspect) -->
  <path d="M31 55 L50 40 L69 25" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" opacity="0.6" />
</svg>